<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" fill="none">
  <!-- Base Shadow -->
  <ellipse cx="200" cy="435" rx="100" ry="12" fill="#E2E8F0" opacity="0.8"/>

  <!-- Orbital Ring & Nodes -->
  <path d="M 60,165 A 175,175 0 0,1 340,165" stroke="#155DFC" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 55,200 A 175,175 0 0,0 100,320" stroke="#155DFC" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 345,200 A 175,175 0 0,1 300,320" stroke="#155DFC" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Orbital Nodes -->
  <circle cx="200" cy="30" r="18" fill="#155DFC"/>
  <circle cx="30" cy="170" r="18" fill="#155DFC"/>
  <circle cx="370" cy="170" r="18" fill="#155DFC"/>

  <!-- Upper Blue 'M' Element -->
  <g>
    <!-- Left Leg of M -->
    <path d="M 90,100 L 155,100 L 155,290 C 155,305 130,325 105,300 C 95,290 90,265 90,240 Z" fill="#0D47A1"/>
    <!-- Right Leg of M -->
    <path d="M 310,100 L 245,100 L 245,290 C 245,305 270,325 295,300 C 305,290 310,265 310,240 Z" fill="#0D47A1"/>
    <!-- Center V of M -->
    <path d="M 90,100 L 200,240 L 310,100 L 265,100 L 200,185 L 135,100 Z" fill="#155DFC"/>
    <!-- Top M main solid block -->
    <path d="M 90,100 L 155,100 L 200,180 L 245,100 L 310,100 L 310,210 Q 310,260 270,285 L 255,255 L 265,210 L 265,130 L 200,210 L 135,130 L 135,210 L 145,255 L 130,285 Q 90,260 90,210 Z" fill="url(#blue_grad)"/>
  </g>

  <!-- 4-Pane Window Icon -->
  <g fill="#0D47A1">
    <rect x="178" y="270" width="18" height="18" rx="4"/>
    <rect x="204" y="270" width="18" height="18" rx="4"/>
    <rect x="178" y="296" width="18" height="18" rx="4"/>
    <rect x="204" y="296" width="18" height="18" rx="4"/>
  </g>

  <!-- Lower Green Shield / V Element -->
  <g>
    <!-- Left Wing Green -->
    <path d="M 90,260 L 200,430 L 200,380 L 120,220 C 105,235 95,248 90,260 Z" fill="#16A34A"/>
    <!-- Right Wing Green -->
    <path d="M 310,260 L 200,430 L 200,380 L 280,220 C 295,235 305,248 310,260 Z" fill="#22C55E"/>
    <!-- Full Green Shield Main path with Gradient -->
    <path d="M 90,260 Q 90,300 200,430 Q 310,300 310,260 L 265,225 Q 260,280 200,380 Q 140,280 135,225 Z" fill="url(#green_grad)"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="blue_grad" x1="90" y1="100" x2="310" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E63F1"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="green_grad" x1="90" y1="225" x2="310" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
</svg>
